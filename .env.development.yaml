# used by vue.config.vue, not vue-cli, because vue-cli have to start with VUE_APP_

MONA_ROUTE_MODE: hash
MONA_TITLE: 莫娜占卜铺
# Base address of online-service for usage stats; empty keeps usage stats off. Release builds set it.
MONA_USAGE_STATS_URL: ""
# Content patch channel: base address of the folder that holds manifest.json, manifest.sig and files/,
# and the public key (Base64, printed by `node beta-tools/patch-tool.mjs keygen`). Either empty keeps content patches off.
MONA_PATCH_BASE_URL: ""
MONA_PATCH_PUBLIC_KEY: ""
